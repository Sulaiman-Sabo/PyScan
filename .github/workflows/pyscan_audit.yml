name: PyScan Security Audit CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  pyscan-security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install PyScan Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run PyScan Automated AI Security Audit
        run: |
          python pyscan_cli.py --path . --output pyscan_report.json

      - name: Upload PyScan Security Audit Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: pyscan-security-audit-report
          path: pyscan_report.json
